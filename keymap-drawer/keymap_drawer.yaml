# Configuración de keymap-drawer para el keymap sthyr (Silakka54).
# Leyendas de los alias de la distribución latinoamericana (ES_*) y alias propios.
parse_config:
  # Home row mods y mod-taps definidos con #define en keymap.c
  raw_binding_map:
    TAB_CTL: {t: ⇥, h: Ctrl}
    HM_A: {t: A, h: Super}
    HM_R: {t: R, h: Alt}
    HM_S: {t: S, h: Shift}
    HM_G: {t: G, h: Meh}
    HM_E: {t: E, h: Shift}
    HM_I: {t: I, h: Alt}
    HM_O: {t: O, h: Super}
  qmk_remove_keycode_prefix: [KC_, ES_]
  toggle_label: fijar
  modifier_fn_map:
    left_ctrl: Ctrl
    right_ctrl: Ctrl
    left_shift: Shift
    right_shift: Shift
    left_alt: Alt
    right_alt: AltGr
    left_gui: Super
    right_gui: Super
    keycode_combiner: '{mods}+{key}'
    mod_combiner: '{mod_1}+{mod_2}'
    special_combinations:
      left_ctrl+left_alt+left_shift: Meh
  qmk_keycode_map:
    'NO': ''
    LALT: Alt
    RALT: AltGr
    LSFT: Shift
    RSFT: Shift
    LCTL: Ctrl
    RCTL: Ctrl
    LGUI: Super
    MEH: Meh
    ES_PIPE: '|'
    ES_QUOT: ''''
    ES_IQUE: '¿'
    ES_ACUT: '´'
    ES_PLUS: '+'
    ES_NTIL: 'Ñ'
    ES_LCBR: '{'
    ES_RCBR: '}'
    ES_LABK: '<'
    ES_COMM: ','
    ES_DOT: '.'
    ES_MINS: '-'
    ES_MORD: '°'
    ES_EXLM: '!'
    ES_DQUO: '"'
    ES_NUMB: '#'
    ES_DLR: '$'
    ES_PERC: '%'
    ES_AMPR: '&'
    ES_SLSH: '/'
    ES_LPRN: '('
    ES_RPRN: ')'
    ES_EQL: '='
    ES_QUES: '?'
    ES_IEXL: '¡'
    ES_DIAE: '¨'
    ES_ASTR: '*'
    ES_LBRC: '['
    ES_RBRC: ']'
    ES_RABK: '>'
